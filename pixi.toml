[workspace]
name = "gonzo"
version = "0.1.0"
channels = [
  "conda-forge/label/fenics-dev",
  "conda-forge",
  "bioconda",
  "https://fsl.fmrib.ox.ac.uk/fsldownloads/fslconda/public/",
  "jorgenriseth",
]
platforms = ["linux-64"]

# Gonzo's own requirements, shared by the development and release environments.
# The scientific stack (FEniCS, SVMTK, PyVista, FSL, ...) comes from gmri2fem.
[dependencies]
python = ">=3.11,<3.12"
snakemake = ">=9.9.0,<10"
snakemake-executor-plugin-cluster-generic = ">=1.0.9,<2"
dcm2niix = ">=1.0.20250506,<2"
trame = ">=3.11.0,<4"
notebook = "<7"
jupyter_server = "<2"
seaborn = "*"
scikit-learn = "*"
jupyter-book = ">=2.0.0,<3"
ghp-import = ">=2.1.0,<3"

# Editable sibling checkout of gmri2fem. Its Python requirements are read from
# its metadata; the conda-only parts mirror gmri2fem's conda recipe
# (conda-recipe/dependencies.toml and conda-recipe/fsl.toml).
[feature.gmri2fem-dev.dependencies]
fenics = ">=2019.2.0.dev20240219,<2020"
svmtk = ">=2.0.1,<3"
h5py = ">=3,<4"
pyvista = ">=0.44,<0.45"
vtk = "<9.4"
fsl-eddy = ">=2401.2,<2402"
fsl-topup = ">=2203.5,<2204"
fsl-fdt = ">=2202.11,<2203"
fsl-bet2 = ">=2111.8,<2112"
fsl-avwutils = "==2209.3"

[feature.gmri2fem-dev.pypi-dependencies]
gmri2fem = { path = "../gmri2fem/", editable = true }

[environments]
default = ["gmri2fem-dev"]

[tasks]
docs-build = "jupyter-book build --all ."
docs-execute-and-build = "bash docs/execute-and-build.sh"
docs-start = "jupyter-book start ."

[activation]
env = { FSLDIR = "$CONDA_PREFIX", FSLOUTPUTTYPE = "NIFTI_GZ", MPLCONFIGDIR = "$CONDA_PREFIX/matplotlib", DIJITSO_CACHE_DIR = "$HOME/.cache" }
