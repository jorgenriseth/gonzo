name: Validate pipeline environment
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: v0.83.0
          run-install: false
      - name: Check environment metadata
        run: |
          python3 -m unittest discover -s tests -p 'test_environment_metadata.py'
      - run: pixi install --locked --run-post-link-scripts
      - run: pixi run --locked python scripts/validate_environment.py
